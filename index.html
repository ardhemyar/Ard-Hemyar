<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تراث اليمن - أصالة وفخامة</title>
    <!-- Google Fonts: Readex Pro & Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-gold: #C59B27;
            --primary-dark-gold: #9E7916;
            --bg-cream: #FDFBF7;
            --text-dark: #1E140C;
            --text-muted: #6B5E52;
            --card-bg: #FFFFFF;
            --whatsapp-green: #25D366;
            --danger-red: #E53E3E;
            --border-color: #EFE8DC;
            --shadow-sm: 0 4px 12px rgba(30, 20, 12, 0.05);
            --shadow-hover: 0 12px 28px rgba(30, 20, 12, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Readex Pro', sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo i {
            color: var(--primary-gold);
            font-size: 1.6rem;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 380px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            overflow: hidden;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(30, 20, 12, 0.4) 0%, rgba(30, 20, 12, 0.8) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            padding: 20px;
        }

        .hero-content h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #FFF;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .hero-content p {
            font-size: 1.1rem;
            color: #E2D8CE;
            margin-bottom: 20px;
        }

        /* Trust Badges Bar */
        .trust-bar {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .trust-item i {
            color: var(--primary-gold);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Categories Filter */
        .categories-wrapper {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 0 20px 0;
            scrollbar-width: none;
        }

        .categories-wrapper::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .category-pill.active, .category-pill:hover {
            background: var(--primary-gold);
            color: #FFF;
            border-color: var(--primary-gold);
            box-shadow: 0 4px 15px rgba(197, 155, 39, 0.3);
        }

        /* Section Title */
        .section-header {
            margin: 25px 0 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2::before {
            content: '';
            width: 5px;
            height: 22px;
            background: var(--primary-gold);
            border-radius: 3px;
            display: inline-block;
        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        /* Product Card */
        .product-card {
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #F4EFEA;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .card-img-wrapper img {
            transform: scale(1.08);
        }

        .badge-discount {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--danger-red);
            color: #FFF;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            z-index: 2;
        }

        .badge-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(30, 20, 12, 0.75);
            color: #FFF;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .product-category-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .price-container {
            margin-top: auto;
            margin-bottom: 15px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .current-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-dark-gold);
        }

        .old-price {
            font-size: 0.9rem;
            color: #A09386;
            text-decoration: line-through;
        }

        .price-currency {
            font-size: 0.8rem;
            font-weight: normal;
        }

        .btn-whatsapp {
            background: var(--whatsapp-green);
            color: #FFF;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .btn-whatsapp:hover {
            background: #1EBE5D;
        }

        /* Floating WhatsApp Button */
        .floating-whatsapp {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: var(--whatsapp-green);
            color: #FFF;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            z-index: 999;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .floating-whatsapp:hover {
            transform: scale(1.1);
        }

        /* Admin Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #FFF;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-hover);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-submit {
            background: var(--primary-gold);
            color: #FFF;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero { height: 300px; }
            .hero-content h1 { font-size: 1.8rem; }
            .hero-content p { font-size: 0.95rem; }
            .trust-bar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="#" class="logo">
            <i class="fa-solid fa-crown"></i>
            <span id="storeNameText">متجر تراث اليمن</span>
        </a>
        <button class="admin-btn" onclick="openAdminModal()">
            <i class="fa-solid fa-user-lock"></i> لوحة التحكم
        </button>
    </nav>

    <!-- Hero Banner -->
    <section class="hero" id="heroSection" style="background-image: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1200');">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="heroTitle">أصالة التراث اليماني بين يديك</h1>
            <p>أجود أنواع العسل الطبيعي، العقيق اليماني الفاخر، والبن الخولاني الأصيل</p>
            <div class="trust-bar">
                <div class="trust-item"><i class="fa-solid fa-shield-halved"></i> جودة مضمونة 100%</div>
                <div class="trust-item"><i class="fa-solid fa-truck-fast"></i> توصيل لكافة المناطق</div>
                <div class="trust-item"><i class="fa-solid fa-hand-holding-dollar"></i> الدفع عند الاستلام</div>
            </div>
        </div>
    </section>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Categories Filter -->
        <div class="categories-wrapper" id="categoriesContainer">
            <button class="category-pill active" onclick="filterCategory('all', this)">الكل 🍯</button>
            <!-- ستضاف الأقسام ديناميكياً -->
        </div>

        <!-- Section Title -->
        <div class="section-header">
            <h2>منتجاتنا المختارة</h2>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid">
            <!-- ستضاف بطاقات المنتجات ديناميكياً -->
        </div>

    </div>

    <!-- Floating WhatsApp -->
    <a href="https://wa.me/967770000000" target="_blank" class="floating-whatsapp" title="تواصل معنا عبر واتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Admin Login / Control Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fa-solid fa-lock"></i> تسجيل دخول الادمن</h3>
                <button class="close-btn" onclick="closeAdminModal()">&times;</button>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="loginUser" class="form-control" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPass" class="form-control" required placeholder="admin123">
                </div>
                <button type="submit" class="btn-submit">دخول</button>
            </form>

            <!-- Quick Add Product (For Logged-in Admin) -->
            <div id="adminPanel" style="display: none;">
                <h4>إضافة منتج جديد</h4>
                <form onsubmit="handleAddProduct(event)" style="margin-top: 15px;">
                    <div class="form-group">
                        <label>اسم المنتج</label>
                        <input type="text" id="prodTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>السعر (ر.ي)</label>
                        <input type="number" id="prodPrice" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>رابط الصورة</label>
                        <input type="url" id="prodImage" class="form-control" placeholder="https://..." required>
                    </div>
                    <button type="submit" class="btn-submit">حفظ المنتج</button>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript & Supabase Integration -->
    <script>
        // 1. إعدادات Supabase (استبدل القيم ببيانات مشروعك الخاصة)
        const SUPABASE_URL = 'https://gygjtvfwhdfiwcahdqyw.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_TPyNp8bSFHE6xO5GGdEtbA_8_53idMv';
        
        let supabaseClient = null;
        if (SUPABASE_URL !== 'ضع_رابط_مشروعك_هنا') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // بيانات افتراضية ممتازة للعرض التجريبي إذا لم يتم ربط السيرفر بعد
        let productsData = [
            { id: 1, title: 'عسل سدر دوعني درجة أولى', price: 25000, is_discount: true, discount_price: 21000, category_id: 1, image_url: 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?q=80&w=600' },
            { id: 2, title: 'خاتم عقيق يماني كبدي فاخر', price: 18000, is_discount: false, discount_price: 0, category_id: 2, image_url: 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?q=80&w=600' },
            { id: 3, title: 'بن خولاني صافي - درجة ممتازة', price: 8500, is_discount: true, discount_price: 7500, category_id: 3, image_url: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=600' },
            { id: 4, title: 'عسل جرداني معزز بغذاء الملكات', price: 30000, is_discount: false, discount_price: 0, category_id: 1, image_url: 'https://images.unsplash.com/photo-1587049352851-8d4e89133924?q=80&w=600' }
        ];

        let categoriesData = [
            { id: 1, name: 'عسل يمني' },
            { id: 2, name: 'فضيات وعقيق' },
            { id: 3, name: 'بن وقشر' }
        ];

        // رقم الواتساب الخاص بالمتجر لتلقي الطلبات
        const STORE_PHONE = "967770000000"; 

        // تحميل البيانات عند فتح الصفحة
        window.onload = async function() {
            if (supabaseClient) {
                await fetchSettings();
                await fetchCategories();
                await fetchProducts();
            } else {
                renderCategories(categoriesData);
                renderProducts(productsData);
            }
        };

        // جلب الإعدادات (غلاف واسم المتجر)
        async function fetchSettings() {
            try {
                const { data } = await supabaseClient.from('settings').select('*');
                if (data) {
                    data.forEach(item => {
                        if (item.key === 'store_title') document.getElementById('storeNameText').innerText = item.value;
                        if (item.key === 'cover_image') document.getElementById('heroSection').style.backgroundImage = `url('${item.value}')`;
                    });
                }
            } catch (e) { console.log(e); }
        }

        // جلب الأقسام
        async function fetchCategories() {
            try {
                const { data } = await supabaseClient.from('categories').select('*');
                if (data && data.length > 0) {
                    categoriesData = data;
                    renderCategories(categoriesData);
                }
            } catch (e) { console.log(e); }
        }

        // جلب المنتجات
        async function fetchProducts() {
            try {
                const { data } = await supabaseClient.from('products').select('*');
                if (data && data.length > 0) {
                    productsData = data;
                    renderProducts(productsData);
                }
            } catch (e) { console.log(e); }
        }

        // عرض الأقسام
        function renderCategories(categories) {
            const container = document.getElementById('categoriesContainer');
            let html = `<button class="category-pill active" onclick="filterCategory('all', this)">الكل 🍯</button>`;
            categories.forEach(cat => {
                html += `<button class="category-pill" onclick="filterCategory(${cat.id}, this)">${cat.name}</button>`;
            });
            container.innerHTML = html;
        }

        // عرض المنتجات
        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">لا توجد منتجات حالياً.</p>`;
                return;
            }

            grid.innerHTML = products.map(prod => {
                const hasDiscount = prod.is_discount && prod.discount_price > 0;
                const finalPrice = hasDiscount ? prod.discount_price : prod.price;
                const categoryObj = categoriesData.find(c => c.id == prod.category_id);
                const categoryName = categoryObj ? categoryObj.name : 'منتج فاخر';

                // تجهيز رابط الواتساب الجذاب
                const waMessage = encodeURIComponent(`مرحباً 👋 أرغب في طلب المنتج التالي:\n📌 *${prod.title}*\n💰 السعر: ${finalPrice.toLocaleString()} ريال يمني`);
                const waUrl = `https://wa.me/${STORE_PHONE}?text=${waMessage}`;

                return `
                    <div class="product-card">
                        <div class="card-img-wrapper">
                            ${hasDiscount ? `<span class="badge-discount">تخفيض 🏷️</span>` : ''}
                            <span class="badge-tag">طبيعي 100%</span>
                            <img src="${prod.image_url || prod.image || 'https://via.placeholder.com/300'}" alt="${prod.title}">
                        </div>
                        <div class="card-body">
                            <span class="product-category-name">${categoryName}</span>
                            <h3 class="product-title">${prod.title}</h3>
                            
                            <div class="price-container">
                                <span class="current-price">${finalPrice.toLocaleString()} <span class="price-currency">ر.ي</span></span>
                                ${hasDiscount ? `<span class="old-price">${prod.price.toLocaleString()} ر.ي</span>` : ''}
                            </div>

                            <a href="${waUrl}" target="_blank" class="btn-whatsapp">
                                <i class="fa-brands fa-whatsapp"></i> طلب مباشر عبر واتساب
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // فلترة المنتجات حسب القسم
        function filterCategory(catId, btnElement) {
            document.querySelectorAll('.category-pill').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (catId === 'all') {
                renderProducts(productsData);
            } else {
                const filtered = productsData.filter(p => p.category_id == catId);
                renderProducts(filtered);
            }
        }

        // التحكم في النافذة المنبثقة (Modal)
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        // تسجيل دخول الادمن
        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if (supabaseClient) {
                const { data } = await supabaseClient.from('users').select('*').eq('username', user).eq('password', pass);
                if (data && data.length > 0) {
                    alert('تم تسجيل الدخول بنجاح!');
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('modalTitle').innerText = 'لوحة التحكم السريعة';
                } else {
                    alert('بيانات الدخول غير صحيحة!');
                }
            } else {
                if (user === 'admin' && pass === 'admin123') {
                    alert('تم الدخول كمدير تجريبي!');
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                } else {
                    alert('خطأ في اسم المستخدم أو كلمة المرور');
                }
            }
        }

        // إضافة منتج جديد
        async function handleAddProduct(e) {
            e.preventDefault();
            const title = document.getElementById('prodTitle').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const image_url = document.getElementById('prodImage').value;

            const newProd = { title, price, image_url, category_id: 1 };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('products').insert([newProd]);
                if (!error) {
                    alert('تم إضافة المنتج بنجاح!');
                    fetchProducts();
                    closeAdminModal();
                } else {
                    alert('حدث خطأ: ' + error.message);
                }
            } else {
                productsData.push({ ...newProd, id: Date.now() });
                renderProducts(productsData);
                alert('تمت الإضافة بنجاح في النسخة التجريبية!');
                closeAdminModal();
            }
        }
    </script>
</body>
</html>
